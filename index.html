<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17171c" />
    <meta name="description" content="Калькулятор: обычный и инженерный режимы" />
    <title>Calc</title>
    <script>
      // Тема до загрузки React — без вспышки. Ключ и значения как в ThemeProvider.
      (function () {
        var theme = null;
        try {
          var saved = JSON.parse(localStorage.getItem('calc:theme'));
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {
          // хранилище недоступно или повреждено
        }
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e) {
            theme = 'dark';
          }
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f1f2f3' : '#17171c');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
